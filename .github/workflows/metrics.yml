name: GitHub Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Cairo
          filename: github-metrics-overview.svg
          committer_message: "chore: update overview metrics [skip ci]"

      - name: Languages and achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          filename: github-metrics-languages.svg
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 12
          committer_message: "chore: update languages metrics [skip ci]"

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          filename: github-metrics-calendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          committer_message: "chore: update calendar metrics [skip ci]"
