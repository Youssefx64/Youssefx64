name: GitHub Metrics
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: header
          config_timezone: Africa/Cairo
          filename: github-metrics-profile.svg
          committer_message: "chore: update profile metrics [skip ci]"

      - name: Activity and community
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: activity, community
          config_timezone: Africa/Cairo
          filename: github-metrics-activity.svg
          committer_message: "chore: update activity metrics [skip ci]"

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: repositories
          config_timezone: Africa/Cairo
          filename: github-metrics-repos.svg
          committer_message: "chore: update repos metrics [skip ci]"

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          filename: github-metrics-languages.svg
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          committer_message: "chore: update languages metrics [skip ci]"

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Youssefx64
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          filename: github-metrics-calendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          committer_message: "chore: update calendar metrics [skip ci]"